<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art Style Protection Study</title>
  <link rel="stylesheet" href="./style.css?v=study-v8" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="logo">◈ Art Style <span>Protection Study</span></div>
      <div class="step-info">
        <span id="stageCount" class="stage-count">Preparing study</span>
        <div id="stepLabel" class="step">Loading…</div>
      </div>
    </header>
    <div class="loadbar" role="progressbar" aria-label="Study progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="loadFill"></div></div>
    <main id="content" aria-live="polite"><div class="center">Loading study…</div></main>
    <footer class="bottom">
      <span id="footerText">Anonymous visual comparison study</span>
      <div class="footer-actions">
        <button id="backButton" class="back-button" hidden>← Back</button>
        <button id="nextButton" disabled>Next</button>
      </div>
    </footer>
  </div>
  <div id="imageModal" class="image-modal" hidden>
    <button id="closeModal" class="modal-close" aria-label="Close enlarged image">×</button>
    <img id="modalImage" alt="Enlarged artwork" />
  </div>
  <script src="./manifest.js"></script>
  <script src="./app.js?v=study-v8"></script>
</body>
</html>
